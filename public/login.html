<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema CAPS</title>
    <script src="./js/tailwind.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Sistema CAPS</h1>
            <p class="text-gray-500">Centro de Atenção Psicossocial - Coelho Neto/MA</p>
        </div>
        <form id="login-form">
            <div class="mb-4">
                <label for="cpf" class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
                <input type="text" id="cpf" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                Entrar
            </button>
            <p id="error-message" class="mt-4 text-center text-red-500 text-sm"></p>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            Não tem uma conta? 
            <a href="register_user.html" class="font-medium text-blue-600 hover:text-blue-500">Registre-se</a>
        </p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema CAPS</title>
    <script src="./js/tailwind.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Criar Nova Conta</h1>
        </div>
        
        <form id="register-form">
            <div class="mb-4">
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">Nome Completo</label>
                <input type="text" id="nome" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
             <div class="mb-4">
                <label for="cpf" class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
                <input type="text" id="cpf" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="000.000.000-00">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                Registrar
            </button>
        </form>

        <p id="error-message" class="mt-4 text-center text-red-500 text-sm"></p>
        <p id="success-message" class="mt-4 text-center text-green-600 text-sm"></p>
        <p class="mt-6 text-center text-sm text-gray-600">
            Já tem uma conta? 
            <a href="login.html" class="font-medium text-blue-600 hover:text-blue-500">Faça o login</a>
        </p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
